<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
    footer- {
    position: fixed;
    bottom: 0;

}

*{
    font-family: quicksand;
}

footer {
   margin-top: 50px; 
}

@media (max-height:800px) {
   footer {
       position: static;
   }
   header {
       padding-top: 40px;
   }
}

.footer-distributed { 
   background-color: #ede6dc;
   box-sizing: border-box;
   width: 115%;
   text-align: left;
   font: bold 16px sans-serif;
   padding: 50px 50px 60px 50px;
   position: absolute;
}

.footer-distributed .footer-left, .footer-distributed .footer-center, .footer-distributed .footer-right {
   display: inline-block;
   vertical-align: top;
}

/* Footer left */
.footer-distributed .footer-left img{
   width: 100px;
   height: 100px;
   border-radius: 50px;
}

.footer-distributed .footer-left {
   width: 30%;
}

.footer-distributed h3 {
   color: #4e4e4d;
   font-family: normal 36px 'quicksand', cursive;
   margin: 0;
}


.footer-distributed h3 span {
   color: #4e4e4d;
}

/* Footer li5ks */

.footer-distributed .footer-links {
   color: #4e4e4d;
   margin: 20px 0 12px;
}

.footer-distributed .footer-links a {
   display: inline-block;
   line-height: 1.8;
   text-decoration: none;
   color: inherit;
}

.footer-distributed .footer-links a:hover{
   color: pink;
}

.footer-distributed .footer-company-name {
   color: #4e4e4d;
   font-size: 20px;
   font-weight: normal;
   margin: 0;
}

/* Footer Center */

.footer-distributed .footer-center {
   width: 35%;
}

.footer-distributed .footer-center i {
   background-color: #33383b;
   color: #EDE6DC;
   font-size: 25px;
   width: 38px;
   height: 38px;
   border-radius: 50%;
   text-align: center;
   line-height: 42px;
   margin: 10px 15px;
   vertical-align: middle;
}

.footer-distributed .footer-center i.fa-envelope {
   font-size: 25px;
   line-height: 38px;
}

.footer-distributed .footer-center p {
   display: inline-block;
   color: #4e4e4d;
   vertical-align: middle;
   margin: 0;
}

.footer-distributed .footer-center p span {
   display: block;
   font-weight: normal;
   font-size: 20px;
   line-height: 2;
}

.footer-distributed .footer-center p a {
   color: #4e4e4d;
   text-decoration: none;
}

/* Footer Right */

.footer-distributed .footer-right {
   width: 30%;
}

.footer-distributed .footer-company-about {
   line-height: 20px;
   color: #4e4e4d;
   font-size: 18px;
   font-weight: normal;
   margin: 0;
}

.footer-distributed .footer-company-about span {
   display: block;
   color: #4e4e4d;
   font-size: 18px;
   font-weight: bold;
   margin-bottom: 20px;
}

.footer-distributed .footer-icons {
   margin-top: 25px;
}

.footer-distributed .footer-icons a {
   display: inline-block;
   width: 35px;
   height: 35px;
   cursor: pointer;
   background-color: #33383b;
   border-radius: 2px;
   font-size: 20px;
   color: #ffffff;
   text-align: center;
   line-height: 35px;
   margin-right: 3px;
   margin-bottom: 5px;
}

.footer-distributed .footer-icons a:hover {
   background-color: #4e4e4d;
}

.footer-links a:hover {
   color: #3F71EA;
}

@media (max-width: 880px) {
   .footer-distributed .footer-left, .footer-distributed .footer-center, .footer-distributed .footer-right {
       display: block;
       width: 100%;
       margin-bottom: 40px;
       text-align: center;
   }
   .footer-distributed .footer-center i {
       margin-left: 0;
   }
}  
</style>
<body>
    <footer class="footer-distributed">
        <div class="footer-left">
            <h3>Byte<span> Beauty</span></h3>

            <p class="footer-links">
            <a href="#">Home</a>
            |
            <a href="#">About</a>
            |
            <a href="#">contact</a>
            |
            <a href="#">blog</a>
            </p>
            <p class="footer-company-name">make ups <strong>Byte Beauty Developer</strong> All rights reserved</p>
        </div>

        <div class="footer-center">
            <div>
                <i class="fa fa-map-marker"></i>
                <p><span>Quezon</span>City</p>
            </div>
            <div>
                <i class="fa fa-phone"></i>
                <p>+69 945-723-6268</p>
            </div>
            <div>
                <i class="fa fa-envelope"></i>
                <p><a href="#">kong@gmail.com</a></p>
            </div>
        </div>

        <div class="footer-right">
            <p class="footer-company-about">
                <span>About Us</span>
                <strong>privacy policy</strong><br> terms and conditions<br><br>Get the latest updates and receive member exclusive offers when you subscribe
            </p>
            <div class="footer-icons">
                <a href="#"> <i class="fa-brands fa-facebook"></i></a>
                <a href="#"> <i class="fa-brands fa-linkedin"></i></a>
                <a href="#"> <i class="fa-brands fa-square-instagram"></i></a>
                <a href="#"> <i class="fa-brands fa-square-twitter"></i></a>
                <a href="#"> <i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
