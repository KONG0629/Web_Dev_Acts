<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: quicksand;
}

@font-face{
    font-family: quicksand;
    src: url("style-style/Fonts/Quicksand/Quicksand-VariableFont_wght.ttf");
    src: url("style-style/Fonts/Lustria/Lustria-Regular.ttf");
    src: url("style-style/Fonts/Rosario/Rosario-VariableFont_wght.ttf");
 }


body{
    background-color: #FBEFEA;
}
a{
    text-decoration: none;
}
.main-wrap{
    display: flex;
    justify-content: space-between;
}
.main-head{
    width: 60px;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    transition: .3s ease-in-out;
    visibility: hidden;
}
.main-wrap .main-head.active{
    width: 15%;
    visibility: visible;
}
.main-head .main-nav{
    width: 100%;
}
.main-head .main-nav .navbar{
    width: 100%;
}
.main-head .main-nav .navbar .navbar-nav .title{
    padding: 15px 19px;
    transition: .1s ease-in-out;
}

.main-head .main-nav .navbar .navbar-nav .title .toggler1{
    color: #EDE6DC;
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
    border-radius: 5px;
}
.main-head .main-nav .navbar .navbar-nav .title .toggler1:hover{
    background-color: #4E4E4D;
}

.main-wrap .main-head.active .main-nav .navbar .navbar-nav .title{
    padding: 15px 12px;
}
.main-head .main-nav .navbar .navbar-nav .title h3{
    color: #FFF7EA;
    font-family: quicksand;
    font-size: 25px;
    font-weight: 500;
    line-height: 35px;
    position: relative;
     /**/background-color: #B8A9A8;
     border-radius: 10px;
}
.main-head .main-nav .navbar .navbar-nav .title h3 .title-text{
    font-family: quicksand;
    position: absolute;
    left: 35px;
    opacity: 0;
    transition: .2s ease;
     /**/
}
.main-wrap .main-head.active .main-nav .navbar .navbar-nav .title .title-text{
    opacity: 1;
    
}
.main-head .main-nav .navbar .navbar-nav .nav-list{
    margin: 0;
    padding: 10px 10px;
    /**/
}
.main-head .main-nav .navbar .navbar-nav .nav-list .nav-list-item{
    list-style: none;
    padding: 15px 10px;
    transition: .2s ease-in-out;
    border-radius: 5px;
    margin-bottom: 10px;
    cursor: pointer;
    background-color: #B8A9A8;
}
.main-head .main-nav .navbar .navbar-nav .nav-list .nav-list-item:last-child{
    margin-bottom: 0;
}
.main-head .main-nav .navbar .navbar-nav .nav-list .nav-list-item:hover{
    background: #4E4E4D;
}
.main-head .main-nav .navbar .navbar-nav .nav-list .nav-list-item .nav-link{
    font-family: quicksand;
    color: #FFF7EA;
    display: inline-block;
    font-size: 14px;
    font-family: 'Ubuntu', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    position: relative;
}
.main-head .main-nav .navbar .navbar-nav .nav-list .nav-list-item .nav-link .link-text{
    position: absolute;
    top: 3px;
    left: 35px;
    opacity: 0;
    transition: .2s ease;
}
.main-wrap .main-head.active .main-nav .navbar .navbar-nav .nav-list .nav-list-item .nav-link .link-text{
    opacity: 1;
}
.main-head .main-nav .navbar .navbar-nav .nav-list .nav-list-item .nav-link i{
    margin-right: 5px;
    font-size: 20px;
}
.showcase{
    width: 97%;
    height: 100vh;
    background: url('../img/bg.jpg') no-repeat;
    background-position: center;
    background-size: cover;
    position: relative;
    transition: .3s ease-in-out;
}
.showcase.width{
    width: 80%;
}
.showcase .overlay{
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}
.showcase .head{
    padding: 13px 25px;
}
.showcase .head .toggler{
    display: inline-block;
    background: transparent;
    border: none;
    outline: 0;
    color: #4e4e4d;
    cursor: pointer;
    padding: 10px 10px;
    border-radius: 5px;
    transition: .2s ease;
    position: absolute;
    top: 55px;
    right: 45px;
}
.showcase .head .toggler:hover{
    background: #B8A9A8;
}
.showcase .head .toggler i{
    font-size: 30px;
}
.showcase .content{
    text-align: center;
   margin-bottom: 50px;
}

.showcase .content h3{
    margin-top: -60px;
    font-family: lustria;
    font-size: 45px;
    font-weight: 500;
    line-height: 55px;
    text-transform: capitalize;
    color: #4E4E4D;
}
.showcase .content .welcome{
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}
.showcase .content .welcome .content-text{
    width: 640px;
}

@media only screen and (max-width: 768px) {
    .content-text {
        text-align: center;
    }

    .content-text img {
        max-width: 200%;
        height: auto;
        margin: 70px -200px ;
        transition: max-width 0.5s ease, height 0.5s ease;
    }

    .content-text h3 {
        font-size: 1.5rem;
        text-align: center;
        transition: font-size 0.5s ease;
    }
}

    /*per pages*/
    .perpage-style {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.product-container {
    background-color: #FFF8EF;
    max-width: 1500px;
    width: 100%;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    padding: 50px;
    border-radius: 10px;
    animation: fadeIn 1s ease-in-out;
    display: flex;
    flex-wrap: wrap;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-start;
}

.product {
    flex-basis: calc(45% - 20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 45%;
}

.product-left {
    flex-basis: calc(45% - 20px);
    width: 45%;
}

.product-image {
    width: 100%;
    position: relative;
    padding-top: 100%; /* 1:1 aspect ratio (square) */
}

.product-image img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}


.product-image img:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
}

.product-details {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
}

.product-name {
    font-family: rosario;
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 10px;
    color: #4E4E4D;
}

.product-rating {
    color: #EDD8CF;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
}

.product-rating span {
    font-family: rosario;
    font-size: 1.2rem;
    color: #4E4E4D;
    margin-left: 10px;
}

.product-description {
    font-family: rosario;
    font-size: 1.2rem;
    color: #4E4E4D;
    line-height: 1.8;
    margin: 20px 0;
    background: #FBEFEA;
    padding: 20px;
    border-radius: 8px;
    width: 100%;
}

.buy-now-btn {
    font-family: rosario;
    padding: 15px 30px;
    font-size: 1.5rem;
    color: #4E4E4D;
    background-color: #EDD8CF;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
}

.buy-now-btn:hover {
    background-color: #EDD8CF;
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(250, 146, 139, 0.3);
}

.related-products {
    margin-top: 10px;
    width: 100%;
}

.related-products h2 {
    font-family: rosario;
    font-size: 3rem;
    color: #4E4E4D;
    margin-bottom: 20px;
    text-align: center;
}

.related-product-list {
    display: flex;
    justify-content: space-between;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.related-product {
    width: calc(25% - 20px);
    margin-bottom: 20px;
    text-align: center;
    background: #FBEFEA;
    padding: 20px; /* Increased padding for a better appearance */
    border-radius: 8px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Added box shadow for depth */
}

.related-product img {
    width: 100%;
    height: 250px; /* Fixed height for all images */
    border-radius: 8px;
    transition: transform 0.3s ease;
}


.related-product p {
    font-family: rosario;
    margin-top: 20px; /* Increased margin for better spacing */
    font-size: 1.2rem;
    color: #4E4E4D;
}

.related-product:hover {
    transform: translateY(-5px); /* Slightly reduce the hover translation */
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* Enhance the hover box shadow */
}

@media (max-width: 1200px) {
    .related-product {
        width: calc(33.33% - 20px);
    }
}

@media (max-width: 768px) {
    .related-product {
        width: calc(50% - 20px);
    }
}

@media (max-width: 480px) {
    .related-product {
        width: calc(100% - 20px);
    }
}

@media (max-width: 1024px) {
    .product, .product-left {
        flex-basis: calc(50% - 20px);
    }
}

@media (max-width: 768px) {
    .product, .product-left {
        flex-basis: calc(100% - 20px);
    }

    .related-product {
        flex-basis: calc(50% - 20px);
    }
}

@media (max-width: 480px) {
    .related-product {
        flex-basis: calc(100% - 20px);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

/*per pages*/
.carousel-container {
    display: flex;
    overflow-x: auto;
    margin-top: 20px;
    gap: 10px;
    padding-bottom: 10px;
    width: 100%; /* Ensure the container spans the full width */
}

.carousel-container::-webkit-scrollbar {
    display: none;
}

.carousel-item {
    margin-left: 12.5px;
    flex: 0 0 auto;
    width: 20%; /* Adjust the width of each item as needed */
    cursor: pointer;
    position: relative;
}

.carousel-item img {
    width: 90%;
    height: 90%;
    border-radius: 5px;
    transition: transform 0.3s ease;
}

.carousel-item:hover img {
    transform: scale(1.1);
}

.carousel-item:hover::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 5px;
}

@keyframes fadeIn {
    0% {
        opacity: 0;
        transform: translateY(20px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}
@media (max-width: 768px) {
    .carousel-item {
        width: 30%; /* Adjust the width of each item for smaller screens */
    }
}

@media (max-width: 480px) {
    .carousel-item {
        width: 50%; /* Adjust the width of each item for even smaller screens */
    }
}









    /*Footer style*/

    footer {
   margin-top: 50px; 
}

@media (max-height:800px) {
   footer {
       position: static;
   }
   header {
       padding-top: 40px;
   }
}

.footer-distributed { 
   background-color: #ede6dc;
   box-sizing: border-box;
   width: 103%;
   text-align: left;
   font: bold 16px sans-serif;
   padding: 50px 50px 60px 50px;
   position: absolute;
}

.footer-distributed .footer-left, .footer-distributed .footer-center, .footer-distributed .footer-right {
   display: inline-block;
   vertical-align: top;
}

/* Footer left */
.footer-distributed .footer-left img{
   width: 100px;
   height: 100px;
   border-radius: 50px;
}

.footer-distributed .footer-left {
   width: 30%;
}

.footer-distributed h3 {
    font-family: rosario;
   color: #4e4e4d;
   font-family: normal 36px 'quicksand', cursive;
   margin: 0;
}


.footer-distributed h3 span {
   color: #4e4e4d;
   font-family: rosario;
}

/* Footer li5ks */

.footer-distributed .footer-links {
   color: #4e4e4d;
   margin: 20px 0 12px;
   font-family: rosario;
}

.footer-distributed .footer-links a {
   display: inline-block;
   line-height: 1.8;
   text-decoration: none;
   color: inherit;
   font-family: rosario;
}

.footer-distributed .footer-links a:hover{
    color: #FFF7EA;
}

.footer-distributed .footer-company-name {
   color: #4e4e4d;
   font-size: 20px;
   font-weight: normal;
   margin: 0;
   font-family: rosario;
}
.footer-distributed .footer-company-name strong{
    font-family: rosario;
}

/* Footer Center */

.footer-distributed .footer-center {
   width: 35%;
}

.footer-distributed .footer-center i {
   background-color: #33383b;
   color: #EDE6DC;
   font-size: 25px;
   width: 38px;
   height: 38px;
   border-radius: 50%;
   text-align: center;
   line-height: 42px;
   margin: 10px 15px;
   vertical-align: middle;
}

.footer-distributed .footer-center i.fa-envelope {
   font-size: 25px;
   line-height: 38px;
}

.footer-distributed .footer-center p {
   display: inline-block;
   color: #4e4e4d;
   vertical-align: middle;
   margin: 0;
   font-family: rosario;
}

.footer-distributed .footer-center p span {
   display: block;
   font-weight: normal;
   font-size: 20px;
   line-height: 2;
}

.footer-distributed .footer-center p a {
   color: #4e4e4d;
   text-decoration: none;
}

/* Footer Right */

.footer-distributed .footer-right {
   width: 30%;
   font-family: rosario;
}
.footer-right h1{
    font-family: rosario;
}
.footer-distributed .footer-company-about {
   line-height: 20px;
   color: #4e4e4d;
   font-size: 18px;
   font-weight: normal;
   margin: 0;
   font-family: rosario;
}

.footer-distributed .footer-company-about span {
   display: block;
   color: #4e4e4d;
   font-size: 18px;
   font-weight: bold;
   margin-bottom: 20px;
   font-family: rosario;
}
.footer-company-about strong{
    font-family: rosario;
}
.footer-distributed .footer-icons {
   margin-top: 25px;
}

.footer-distributed .footer-icons a {
   display: inline-block;
   width: 35px;
   height: 35px;
   cursor: pointer;
   background-color: #33383b;
   border-radius: 2px;
   font-size: 20px;
   color: #ffffff;
   text-align: center;
   line-height: 35px;
   margin-right: 3px;
   margin-bottom: 5px;
}

.footer-distributed .footer-icons a:hover {
   background-color: #4e4e4d;
}



@media (max-width: 880px) {
   .footer-distributed .footer-left, .footer-distributed .footer-center, .footer-distributed .footer-right {
       display: block;
       width: 100%;
       margin-bottom: 40px;
       text-align: center;
   }
   .footer-distributed .footer-center i {
       margin-left: 0;
   }
}
